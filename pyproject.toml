[project]
name = "automation"
version = "0.1.0"
description = "Playwright + pytest automation practice"
readme = "README.md"
authors = [
    { name = "Denis", email = "denis5gribenyuk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]

[project.scripts]
automation = "automation:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
