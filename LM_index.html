<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Automation</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --border: #2c3845;
      --text: #acb5bd;
      --muted: #8b9aab;
      --accent: #3d9cf0;
      --accent-hover: #5aadf5;
      --error: #ef3741;
      --ok: #7fd99a;
      --radius: 10px;
      --font: "IBM Plex Sans", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, #1c3a55 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 100%, #243018 0%, transparent 50%),
        var(--bg);
    }

    .card {
      width: min(100% - 2rem, 400px);
      padding: 2rem;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .field { margin-bottom: 1rem; }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 0.7rem 0.85rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 8rem;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #061018;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button[type="submit"]:hover { background: var(--accent-hover); }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      min-height: 1.25rem;
      margin: 1rem 0 0;
      font-size: 0.9rem;
    }

    #message.error { color: var(--error); }
    #message.success { color: var(--ok); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Contact</h1>
    <p class="subtitle">Automation practice contact form</p>

    <form id="contact-form" action="#" method="post" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input
          id="name"
          name="name"
          type="text"
          autocomplete="name"
          placeholder="Ada Lovelace"
          required
        />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="field">
        <label for="subject">Subject</label>
        <input
          id="subject"
          name="subject"
          type="text"
          placeholder="How can we help?"
          required
        />
      </div>

      <div class="field">
        <label for="message-body">Message</label>
        <textarea
          id="message-body"
          name="body"
          placeholder="Write your message..."
          required
          minlength="10"
        ></textarea>
      </div>

      <button id="contact-button" type="submit">Send message</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const form = document.getElementById("contact-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      message.className = "";
      message.textContent = "";

      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const subject = form.subject.value.trim();
      const body = form.body.value.trim();

      if (!name || !email || !subject || !body) {
        message.className = "error";
        message.textContent = "All fields are required.";
        form.dataset.submitted = "false";
        return;
      }

      if (!email.includes("@")) {
        message.className = "error";
        message.textContent = "Enter a valid email address.";
        form.dataset.submitted = "false";
        return;
      }

      if (body.length < 10) {
        message.className = "error";
        message.textContent = "Message must be at least 10 characters.";
        form.dataset.submitted = "false";
        return;
      }

      message.className = "success";
      message.textContent = "Message sent.";
      form.dataset.submitted = "true";
    });
  </script>
</body>
</html>
