<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — Automation</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --border: #2c3845;
      --text: #e7ecf1;
      --muted: #8b9aab;
      --accent: #3d9cf0;
      --accent-hover: #5aadf5;
      --error: #f07178;
      --ok: #7fd99a;
      --radius: 10px;
      --font: "IBM Plex Sans", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, #1c3a55 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 100%, #243018 0%, transparent 50%),
        var(--bg);
    }

    .card {
      width: min(100% - 2rem, 400px);
      padding: 2rem;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .field { margin-bottom: 1rem; }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.7rem 0.85rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
      cursor: pointer;
    }

    .remember input { accent-color: var(--accent); }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #061018;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button[type="submit"]:hover { background: var(--accent-hover); }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      min-height: 1.25rem;
      margin: 1rem 0 0;
      font-size: 0.9rem;
    }

    #message.error { color: var(--error); }
    #message.success { color: var(--ok); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <p class="subtitle">Automation practice login</p>

    <form id="login-form" action="#" method="post" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          required
          minlength="6"
        />
      </div>

      <div class="row">
        <label class="remember" for="remember">
          <input id="remember" name="remember" type="checkbox" />
          Remember me
        </label>
        <a id="forgot-password" href="#forgot">Forgot password?</a>
      </div>

      <button id="login-button" type="submit">Submit</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const VALID_EMAIL = "student@example.com";
    const VALID_PASSWORD = "Playwright1!";

    const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      message.className = "";
      message.textContent = "";

      const email = form.email.value.trim();
      const password = form.password.value;

      if (!email || !password) {
        message.className = "error";
        message.textContent = "Email and password are required.";
        return;
      }

      if (email === VALID_EMAIL && password === VALID_PASSWORD) {
        message.className = "success";
        message.textContent = "Login successful.";
        form.dataset.authenticated = "true";
        return;
      }

      message.className = "error";
      message.textContent = "Invalid email or password.";
      form.dataset.authenticated = "false";
    });
  </script>
</body>
</html>
