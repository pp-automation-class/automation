[project]
name = "automation"
version = "0.1.0"
description = "Playwright + pytest automation practice"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
