[project]
name = "saucedemo"
version = "0.1.0"
description = "Small Playwright + pytest framework for saucedemo.com"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "allure-pytest>=2.16.1",
    "faker>=40.39.0",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "python-dotenv>=1.2.3",
]

# This repo is a test project, not a library we install.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Write a fresh Allure result folder on every run.
addopts = ["--alluredir=allure-results", "--clean-alluredir"]
markers = [
    "smoke: a few fast checks that login and the shop still work",
]
# Log file for each run. INFO is the step.
# DEBUG also writes the locator. See it with --log-file-level=DEBUG.
log_file = "logs/tests.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s %(levelname)-5s %(name)s: %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[tool.black]
target-version = ["py312"]
line-length = 88
