<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — Automation</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --border: #2c3845;
      --text: #e7ecf1;
      --muted: #8b9aab;
      --accent: #3d9cf0;
      --accent-hover: #5aadf5;
      --error: #f07178;
      --ok: #7fd99a;
      --radius: 10px;
      --font: "IBM Plex Sans", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, #1c3a55 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 100%, #243018 0%, transparent 50%),
        var(--bg);
    }

    .card {
      width: min(100% - 2rem, 400px);
      padding: 2rem;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .tab {
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }

    .tab[aria-selected="true"] {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      border-color: var(--accent);
      color: var(--text);
    }

    .panel[hidden] { display: none; }

    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .field { margin-bottom: 1rem; }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.7rem 0.85rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }

    .remember,
    .terms {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
      cursor: pointer;
    }

    .terms { margin-bottom: 1.25rem; font-size: 0.9rem; }

    .remember input,
    .terms input { accent-color: var(--accent); }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #061018;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button[type="submit"]:hover { background: var(--accent-hover); }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      min-height: 1.25rem;
      margin: 1rem 0 0;
      font-size: 0.9rem;
    }

    .message.error { color: var(--error); }
    .message.success { color: var(--ok); }
  </style>
</head>
<body>
  <main class="card">
    <div class="tabs" role="tablist" aria-label="Account forms">
      <button id="tab-signin" class="tab" type="button" role="tab" aria-selected="false" aria-controls="signin-panel">
        Sign in
      </button>
      <button id="tab-signup" class="tab" type="button" role="tab" aria-selected="true" aria-controls="signup-panel">
        Sign up
      </button>
    </div>

    <section id="signin-panel" class="panel" role="tabpanel" hidden>
      <h1>Sign in</h1>
      <p class="subtitle">Automation practice login</p>

      <form id="login-form" action="#" method="post" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
            minlength="6"
          />
        </div>

        <div class="row">
          <label class="remember" for="remember">
            <input id="remember" name="remember" type="checkbox" />
            Remember me
          </label>
          <a id="forgot-password" href="#forgot">Forgot password?</a>
        </div>

        <button id="login-button" type="submit">Submit</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section id="signup-panel" class="panel" role="tabpanel">
      <h1>Sign up</h1>
      <p class="subtitle">Automation practice registration</p>

      <form id="signup-form" action="#" method="post" novalidate>
        <div class="field">
          <label for="signup-name">Name</label>
          <input
            id="signup-name"
            name="name"
            type="text"
            autocomplete="name"
            placeholder="Ada Lovelace"
            required
          />
        </div>

        <div class="field">
          <label for="signup-email">Email</label>
          <input
            id="signup-email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="field">
          <label for="signup-password">Password</label>
          <input
            id="signup-password"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="••••••••"
            required
            minlength="6"
          />
        </div>

        <div class="field">
          <label for="signup-confirm">Confirm password</label>
          <input
            id="signup-confirm"
            name="confirm"
            type="password"
            autocomplete="new-password"
            placeholder="••••••••"
            required
            minlength="6"
          />
        </div>

        <label class="terms" for="signup-terms">
          <input id="signup-terms" name="terms" type="checkbox" />
          I agree to the terms
        </label>

        <button id="signup-button" type="submit">Create account</button>
      </form>

      <p id="signup-message" class="message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const EXISTING_EMAIL = "student@example.com";
    const VALID_EMAIL = "student@example.com";
    const VALID_PASSWORD = "Playwright1!";

    const tabSignin = document.getElementById("tab-signin");
    const tabSignup = document.getElementById("tab-signup");
    const signinPanel = document.getElementById("signin-panel");
    const signupPanel = document.getElementById("signup-panel");
    const loginForm = document.getElementById("login-form");
    const signupForm = document.getElementById("signup-form");
    const loginMessage = document.getElementById("message");
    const signupMessage = document.getElementById("signup-message");

    function showPanel(view) {
      const signup = view === "signup";
      signupPanel.hidden = !signup;
      signinPanel.hidden = signup;
      tabSignup.setAttribute("aria-selected", String(signup));
      tabSignin.setAttribute("aria-selected", String(!signup));
      document.title = signup ? "Sign up — Automation" : "Login — Automation";
    }

    function setMessage(el, type, text) {
      el.className = type ? `message ${type}` : "message";
      el.textContent = text;
    }

    tabSignin.addEventListener("click", () => showPanel("signin"));
    tabSignup.addEventListener("click", () => showPanel("signup"));

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      setMessage(loginMessage, "", "");

      const email = loginForm.email.value.trim();
      const password = loginForm.password.value;

      if (!email || !password) {
        setMessage(loginMessage, "error", "Email and password are required.");
        return;
      }

      if (email === VALID_EMAIL && password === VALID_PASSWORD) {
        setMessage(loginMessage, "success", "Login successful.");
        loginForm.dataset.authenticated = "true";
        return;
      }

      setMessage(loginMessage, "error", "Invalid email or password.");
      loginForm.dataset.authenticated = "false";
    });

    signupForm.addEventListener("submit", (event) => {
      event.preventDefault();
      setMessage(signupMessage, "", "");

      const name = signupForm.name.value.trim();
      const email = signupForm.email.value.trim();
      const password = signupForm.password.value;
      const confirm = signupForm.confirm.value;
      const terms = signupForm.terms.checked;

      if (!name || !email || !password || !confirm) {
        setMessage(signupMessage, "error", "All fields are required.");
        return;
      }

      if (!email.includes("@")) {
        setMessage(signupMessage, "error", "Enter a valid email address.");
        return;
      }

      if (password.length < 6) {
        setMessage(signupMessage, "error", "Password must be at least 6 characters.");
        return;
      }

      if (password !== confirm) {
        setMessage(signupMessage, "error", "Passwords do not match.");
        return;
      }

      if (!terms) {
        setMessage(signupMessage, "error", "You must agree to the terms.");
        return;
      }

      if (email.toLowerCase() === EXISTING_EMAIL) {
        setMessage(signupMessage, "error", "An account with this email already exists.");
        signupForm.dataset.registered = "false";
        return;
      }

      setMessage(signupMessage, "success", "Account created.");
      signupForm.dataset.registered = "true";
    });

    showPanel("signup");
  </script>
</body>
</html>
